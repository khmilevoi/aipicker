[package]
name = "aipicker"
version = "0.1.0"
edition = "2024"
description = "A native Windows tray widget for AI model benchmarks and pricing"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
